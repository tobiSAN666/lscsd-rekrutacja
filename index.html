
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LSCSD Rekrutacja – Etap 1</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #1d1d1d;
      color: white;
      padding: 20px 0;
      text-align: center;
    }
    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: white;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    form {
      display: flex;
      flex-direction: column;
    }
    input, textarea, button {
      margin-bottom: 15px;
      padding: 10px;
      font-size: 16px;
    }
    button {
      background-color: #1d1d1d;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>Los Santos County Sheriff's Department</h1>
    <p>Formularz aplikacyjny – Etap 1</p>
  </header>
  <div class="container">
    <p>Wypełnij poniższy formularz. Twoja aplikacja zostanie przesłana do działu rekrutacji.</p>
    <form action="https://formspree.io/f/mgvzeyoy" method="POST">
      <input type="text" name="Imię i nazwisko IC" placeholder="Imię i nazwisko IC" required>
      <input type="text" name="Wiek IC" placeholder="Wiek IC" required>
      <input type="text" name="Tag Discord" placeholder="Tag Discord (np. user#0001)" required>
      <textarea name="Dlaczego chcesz dołączyć?" placeholder="Dlaczego chcesz dołączyć do LSCSD?" required></textarea>
      <textarea name="Krótka historia postaci IC" placeholder="Opisz krótko swoją postać (IC)" required></textarea>
      <button type="submit">Wyślij aplikację</button>
    </form>
  </div>
</body>
</html>
